<!-- 3D 룸 자리 (단독 실행용 자리표시. 실제 프로젝트에서는 3D 룸이 이 뒤에 있음) -->
<div id="room">
  <p>3D 룸 자리</p>
  <button id="trainObject" type="button">기차 오브젝트 클릭</button>
</div>

<!-- 역사 애니메이션: 아래에서 위로 올라와 3D 룸을 덮음 -->

        <!-- 손그림 떨림: 아주 약한 변위를 시드만 바꿔 초당 7번 교체 -->
        <filter id="boil" x="-5%" y="-10%" width="110%" height="120%">
          <feTurbulence id="boilNoise" type="fractalNoise" baseFrequency="0.035" numOctaves="1" seed="2"/>
          <feDisplacementMap in="SourceGraphic" scale="1.6"/>
        </filter>
        <!-- 기관실 안쪽만 보이게 (조케 하반신은 기관차 몸통 뒤로) -->
        <clipPath id="cabClip" clipPathUnits="userSpaceOnUse">
          <rect x="318" y="-20" width="49" height="86"/>
        </clipPath>
      </defs>

      <!-- 지평선 -->
      <path id="ground" d="M0 842 L1920 842" fill="none" stroke="var(--ground)" stroke-width="1.6"/>

      <g id="scenes"></g>

      <g id="walker" transform="translate(760 842)">
        <g id="walkerFlip"><g id="walkerPoses"></g></g>
      </g>

        <!-- 연기 -->
        <g id="smoke"></g>

        <!-- 객차 1 -->

            <path class="ink draw" d="M379 132 C380 125 386 125 389 129"/>
          </g>
          <g class="wheel" data-cx="440" data-cy="126" data-r="14">
            <circle class="paper" cx="440" cy="126" r="14"/>

            <path class="ink draw" d="M430 131 C433 124 441 124 440 130 C439 135 431 135 432 128"/>
          </g>
        </g>
      </g></g></g>
    </svg>

    <div id="year" aria-hidden="true"><span></span></div>
    <div id="title">IKEA’S HISTORY</div>
    <div class="lb top"></div>

    <button id="close" type="button" aria-label="닫기"><svg viewBox="0 0 48 48"><path d="M14 14 L34 34 M34 14 L14 34"/></svg></button>

</section>
