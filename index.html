<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#030817"><title>IKEA</title>
<link rel="icon" href="./assets/images/common/favicon.ico?v=2" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="./assets/images/common/ikea-icon-32.png?v=2"><link rel="apple-touch-icon" href="./assets/images/common/ikea-icon-180.png?v=2">
<script>
  // 상세페이지에서 나와 돌아오는 중이면 첫 화면부터 아이보리로 덮어 둠 (app.js 가 원을 오므리며 걷어냄)
  // 어느 상세페이지든(src/sections/…) 방으로 돌아오면 자동으로 동작. 주소에 ?from=page 를 붙여도 됨
  (function () {
    const q = new URLSearchParams(location.search);
    let fromPage = q.get('from') === 'page';
    try { fromPage = fromPage || (q.has('room') && new URL(document.referrer).pathname.includes('/src/sections/')); } catch (e) {}
    if (fromPage) document.documentElement.classList.add('atlas-returning');
  })();
</script>
<style>html.atlas-returning #wipe{display:block}</style>
<script>
  // 기존 팀원용 섹션 바로가기와 디버그 주소를 유지합니다.
  const params = new URLSearchParams(location.search);
  if (params.has('section') || params.has('debug')) {
    location.replace('./sections.html' + location.search + location.hash);
  }
</script>
<link rel="stylesheet" href="./src/styles/atlas.css"><link rel="stylesheet" href="./src/styles/loading-intro.css"><link rel="stylesheet" href="./src/styles/splash.css"></head>
<body>
<!-- 로딩 인트로: body 맨 위에 두고 스크립트는 defer 없이 바로 실행 (첫 화면부터 인트로) -->
<div id="intro" aria-hidden="true"><svg id="introSvg" xmlns="http://www.w3.org/2000/svg"></svg></div><script src="./src/core/loading-intro.js"></script>
<!-- 도면 스플래시: 인트로 바로 아래 층. 인트로가 빠지면 세로선에서 이어서 시작하고, 끝나면 미니맵 자리로 들어감 -->
<div id="fp-splash"><canvas id="fp-cv"></canvas></div><div id="fp-cue"><span></span>스크롤해서 들어가기</div><button id="fp-skip" type="button" aria-label="스플래시 건너뛰기">Skip <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3 2.5 8 7l-5 4.5M8.5 2.5 13 7l-4.5 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><i></i></button><script src="./src/core/splash.js"></script>
<div id="vig" aria-hidden="true"></div><main><section class="scene" aria-label="스크롤로 둘러보는 이케아 공간"><canvas id="world" tabindex="0" role="link" aria-label="공간 탐색" aria-disabled="true"></canvas>
<svg id="doors" aria-hidden="true"><defs><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-1 1L1 -1 M0 9L9 0 M8 10L10 8" fill="none" stroke-width=".85"/></pattern></defs><polygon id="opening"></polygon></svg>
<div id="guides" aria-hidden="true" hidden></div>
<svg id="minimap" viewBox="-1.4 -8.8 32.7 31" role="group" aria-label="방 선택 미니맵"></svg>
<header><button id="theme" type="button"><svg class="cord" viewBox="0 0 10 36" aria-hidden="true"><path class="thread" d="M5 0V30"/><path class="tip" d="M5 28.2C5.7 28.2 7.75 31 7.75 32.7C7.75 34.15 6.62 35.2 5 35.2S2.25 34.15 2.25 32.7C2.25 31 4.3 28.2 5 28.2Z"/></svg><span id="themeLabel">불 켜기</span></button></header>
<div class="caption"><h1><a id="enter" href="#about">About</a></h1></div>
</section></main>
<footer inert><nav id="footerlinks" aria-label="공간별 상세페이지"></nav></footer>
<div id="wipe" aria-hidden="true" hidden></div><dialog id="detail" aria-labelledby="dtitle"><article class="folio" id="folio"><h2 id="dtitle" tabindex="-1" autofocus><span id="dlead"></span> <strong id="dword"></strong></h2><nav class="folionav" aria-label="상세페이지 메뉴"><button class="back" id="back" type="button" aria-label="공간으로 돌아가기" title="공간으로 돌아가기">↤</button><div id="chapters"></div></nav><section class="opener"><p id="dtext"></p></section><div id="spreads"></div></article></dialog>
<script src="./src/core/atlas/scene.js"></script><script src="./src/core/atlas/render.js"></script><script src="./src/core/atlas/app.js"></script>
</body></html>
